name: Build & Release KOCHAN Sentinel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore KochanSentinel.sln

      - name: Extract Semantic Version from Tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $clean = $tag.TrimStart('v', 'V')
          if ($clean -notmatch '^\d+\.\d+\.\d+$') { $clean = "1.1.0" }
          "version=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish Standalone Single-File EXE (win-x64)
        shell: pwsh
        run: |
          dotnet publish src/KochanSentinel.App/KochanSentinel.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0 `
            -p:FileVersion=${{ steps.ver.outputs.version }}.0 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./release_out

      - name: Generate SHA-256 Checksum File
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "./release_out/KochanSentinel.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KochanSentinel.exe" | Set-Content -Path "./release_out/SHA256SUMS.txt" -Encoding ASCII
          Get-Content "./release_out/SHA256SUMS.txt"

      - name: Create GitHub Release & Upload EXE + SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "KOCHAN Sentinel ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          files: |
            ./release_out/KochanSentinel.exe
            ./release_out/SHA256SUMS.txt
          body: |
            ### İndirme & Otomatik Güncelleme (Windows 10/11 64-bit)
            - **Zaten KOCHAN Sentinel kullanıyorsanız:** Tekrar indirmenize gerek yok! Uygulamayı açtığınızda üst çubukta veya Ayarlar'da **"Şimdi Güncelle"** butonuna tıklamanız yeterli (SHA-256 doğrulamalı otomatik güncelleme).
            - **İlk kurulum:** Aşağıdaki **`KochanSentinel.exe`** dosyasını doğrudan indirin (kurulum veya ekstra .NET yüklemesi gerekmez, tek dosya çalışır).
            - Yönetici izni (UAC) otomatik istenir. `Ctrl + Shift + H` (veya seçtiğiniz kısayol) ile Mini HUD'ı açıp kapatabilir, `Ctrl + K` ile Komut Paletini açabilirsiniz.
